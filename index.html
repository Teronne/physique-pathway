<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physique Pathway Business HQ</title>
<meta name="theme-color" content="#090909">
<style>html,body{margin:0;background:#090909;color:#fff;font-family:Inter,system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#888;font-size:13px}</style>
</head>
<body>
<div id="boot">Loading Physique Pathway Business HQ…</div>
<script>
fetch('business-hq.html?v=2').then(r=>{if(!r.ok)throw new Error('Unable to load dashboard');return r.text()}).then(html=>{
  html=html.replace(
    '<div class="brand"><div class="mark">PP</div><div><b>PHYSIQUE PATHWAY</b><div class="tag">Results without the guess work</div></div></div>',
    '<div class="brand" style="display:flex;align-items:center"><img src="assets/physique-pathway-logo.png" alt="Physique Pathway" style="display:block;width:290px;max-width:100%;height:auto;object-fit:contain"></div>'
  );
  html=html.replace(
    '<div class="brand"><div class="mark">PP</div><div><b>PHYSIQUE PATHWAY</b><div class="tag">Business HQ</div></div></div>',
    '<div class="brand" style="display:flex;align-items:center;gap:10px"><img src="assets/physique-pathway-logo.png" alt="Physique Pathway" style="display:block;width:180px;height:auto;object-fit:contain"><div class="tag" style="white-space:nowrap">Business HQ</div></div>'
  );
  document.open();document.write(html);document.close();
}).catch(err=>{document.getElementById('boot').textContent='Dashboard failed to load: '+err.message});
</script>
</body>
</html>
