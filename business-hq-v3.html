<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physique Pathway Business HQ</title>
<meta name="theme-color" content="#090909">
<style>
:root{--bg:#090909;--p:#121212;--p2:#171717;--line:#292929;--text:#f7f7f5;--muted:#949494;--red:#b31328;--gold:#d2aa38;--green:#57c985;--blue:#61a8e8;--bad:#ff6575}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}
/* Official supplied logo is a full black canvas, so these wrappers crop to the artwork itself. */
.logoCrop{position:relative;overflow:hidden;flex:none}.logoCrop img{position:absolute;max-width:none;height:auto}.logoLogin{width:310px;height:92px;margin:0 auto 16px}.logoLogin img{width:505px;left:-104px;top:-102px}.logoTop{width:220px;height:56px}.logoTop img{width:360px;left:-74px;top:-73px}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}.authbox{width:min(450px,100%);background:var(--p);border:1px solid var(--line);border-radius:16px;padding:28px}.auth h1{font-size:24px;margin:10px 0 5px}.stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}.input{width:100%;background:#0e0e0e;color:white;border:1px solid #333;border-radius:8px;padding:10px 11px;outline:none}.input:focus{border-color:#5b5b5b}.btn{border:1px solid #3a3a3a;background:#1a1a1a;color:white;border-radius:8px;padding:9px 12px;cursor:pointer}.btn:hover{background:#222}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:800}.btn.red{background:var(--red);border-color:var(--red)}.btn.sm{padding:6px 9px;font-size:12px}
.top{height:64px;position:sticky;top:0;z-index:20;background:#090909f2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:blur(12px)}.user{display:flex;align-items:center;gap:9px}.role{font-size:10px;padding:4px 7px;border-radius:5px;background:#2b151a;color:#e38a98;text-transform:uppercase;font-weight:800}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{border-right:1px solid var(--line);padding:18px 12px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer}.nav button.on,.nav button:hover{background:#191919;color:white}.nav button.money{color:#d6c17a}main{padding:26px;max-width:1500px;width:100%;margin:0 auto}.mobileNav{display:none}
.title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}.title h1{font-size:28px;margin:0}.title p{margin:5px 0 0;color:var(--muted)}.actions,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:13px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1.25fr .75fr}.four{grid-template-columns:repeat(4,1fr)}.card{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:16px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}.value{font-size:26px;font-weight:850;margin-top:5px}.gold{color:var(--gold)}.green{color:var(--green)}.bad{color:var(--bad)}.section{margin-top:22px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}.sectionhead h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#b5b5b5}.note{padding:10px 12px;border:1px solid #3c3217;background:#1b180e;border-radius:8px;color:#d7c078;font-size:12px}.tablewrap{overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:11px}table{border-collapse:collapse;width:100%;min-width:780px}th,td{padding:11px 12px;border-bottom:1px solid #252525;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:#8e8e8e;background:#101010}td{font-size:13px}.name{font-weight:750}.sub{font-size:11px;color:var(--muted);margin-top:2px}.pill{display:inline-block;font-size:10px;font-weight:750;padding:4px 7px;border-radius:5px;background:#292929;color:#ccc}.pill.payfast{background:#0e2a42;color:#83c5f3}.pill.eft{background:#292929}.pill.lump{background:#291744;color:#c5a3ff}.pill.ok{background:#11331f;color:#67d88d}.pill.due{background:#392804;color:#efbe42}.pill.over{background:#3b141a;color:#ff7a88}.list{display:flex;flex-direction:column;gap:8px}.item{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:13px;display:flex;justify-content:space-between;align-items:center;gap:12px}.item small{color:var(--muted)}.toolbar{margin:0 0 11px}.toolbar .input{width:auto;min-width:150px}.chart{height:240px;display:flex;align-items:flex-end;gap:8px;padding:16px 8px 4px;border-top:1px solid #252525;margin-top:11px}.barWrap{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}.bar{width:70%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}.bar.zero{background:#292929}.barLabel{font-size:9px;color:#777}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{min-height:280px;border:1px solid var(--line);background:#0d0d0d;border-radius:10px;padding:10px}.col h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#aaa}.study{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:16px}.study h3{font-size:16px;margin:8px 0}.study p,.study li{color:#c9c9c9;line-height:1.5}.study details{border-top:1px solid #292929;margin-top:9px;padding-top:9px}.study summary{cursor:pointer;color:var(--gold)}.modal{position:fixed;inset:0;background:#000b;z-index:50;display:grid;place-items:center;padding:20px}.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #3a3a3a;border-radius:14px;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.full{grid-column:1/-1}.empty{text-align:center;padding:24px;color:#777}
@media(max-width:900px){.shell{display:block}aside{display:none}.kpis,.four,.two,.kanban{grid-template-columns:1fr 1fr}main{padding:18px 18px 80px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0b0b0bf2;border-top:1px solid var(--line);overflow:auto}.mobileNav button{min-width:92px;flex:1;border:0;background:transparent;color:#888;padding:12px 8px}.mobileNav button.on{color:var(--gold)}}@media(max-width:580px){.kpis,.four,.two,.kanban,.formgrid{grid-template-columns:1fr}.title{flex-direction:column;align-items:flex-start}.top{padding:0 10px}.user .muted{display:none}.logoTop{width:150px;height:46px}.logoTop img{width:255px;left:-55px;top:-54px}.logoLogin{width:270px;height:82px}.logoLogin img{width:445px;left:-93px;top:-90px}.value{font-size:23px}}
</style>
</head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logoCrop logoLogin"><img src="./physique-pathway-logo.png?v=3" alt="Physique Pathway"></div><h1>Business HQ</h1><p class="muted">Clients, payments, earnings and planning in one place.</p><div class="stack"><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button id="signin" class="btn primary">Sign in</button><button id="signup" class="btn">Create account</button><div id="authmsg" class="muted" style="font-size:12px;min-height:18px"></div></div></div></div>
<div id="app" class="hidden"><header class="top"><div class="logoCrop logoTop"><img src="./physique-pathway-logo.png?v=3" alt="Physique Pathway"></div><div class="user"><span id="who" class="muted"></span><span id="role" class="role"></span><button id="logout" class="btn sm">Log out</button></div></header><div class="shell"><aside><nav id="nav" class="nav"></nav></aside><main id="main"></main></div><nav id="mobileNav" class="mobileNav"></nav></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div id="modalBody"></div></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://pcwzqwicscoelycaieka.supabase.co','sb_publishable_05iO7pksLrbFRxPnCVI11w_eqKnFgAh');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'R'+Number(n||0).toLocaleString('en-ZA',{maximumFractionDigits:0}).replace(/,/g,' ');const dstr=d=>d?new Date(String(d).length===10?d+'T12:00:00':d).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'}):'—';
const isoToday=()=>new Date().toISOString().slice(0,10);const addMonths=(d,n)=>{let x=new Date((d||isoToday())+'T12:00:00');x.setMonth(x.getMonth()+n);return x.toISOString().slice(0,10)};const addDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
let page='home',S={profile:null,clients:[],billing:[],payments:[],tasks:[],calendar:[],content:[],research:[],coaches:[],coachEarnings:[]};const owner=()=>['owner','admin'].includes(S.profile?.role);
const navs=[['home','Dashboard'],['clients','Clients'],['payments','Payments','money'],['earnings','Earnings','money'],['planner','Calendar & Tasks'],['content','Content Planner'],['research','Research'],['coaches','Coaches','money']];
function renderNav(){let a=navs.filter(x=>owner()||!x[2]),h=a.map(x=>`<button data-page="${x[0]}" class="${page===x[0]?'on':''} ${x[2]||''}">${x[1]}</button>`).join('');$('#nav').innerHTML=h;$('#mobileNav').innerHTML=h;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderNav();render()})}
function title(h,p,a=''){return `<div class="title"><div><h1>${h}</h1><p>${p}</p></div><div class="actions">${a}</div></div>`}function pill(t,c=''){return `<span class="pill ${c}">${esc(t||'—')}</span>`}function bill(id){return S.billing.find(x=>x.client_id===id&&x.active)||S.billing.find(x=>x.client_id===id)}function client(id){return S.clients.find(x=>x.id===id)}function coach(id){return S.coaches.find(x=>x.id===id)}
async function load(){let q=[['clients','name'],['client_billing','created_at'],['payments','received_date'],['tasks','due_date'],['calendar_items','start_at'],['content_items','scheduled_for'],['research_items','published_date']];if(owner())q.push(['coaches','display_name'],['coach_earnings','period_start']);let rs=await Promise.all(q.map(([t,o])=>sb.from(t).select('*').order(o,{ascending:t!=='research_items'})));let i=0;for(const[t]of q){let k={client_billing:'billing',calendar_items:'calendar',content_items:'content',research_items:'research',coach_earnings:'coachEarnings'}[t]||t;S[k]=rs[i++].data||[]}}
const paid=()=>S.payments.filter(p=>p.status==='paid'&&p.received_date);const cashMonth=(y,m)=>paid().filter(p=>{let d=new Date(p.received_date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()+1===m}).reduce((a,p)=>a+Number(p.amount||0),0);const cashYear=y=>paid().filter(p=>new Date(p.received_date+'T12:00:00').getFullYear()===y).reduce((a,p)=>a+Number(p.amount||0),0);const mrr=()=>S.billing.filter(b=>b.active).reduce((a,b)=>a+Number(b.monthly_equivalent||0),0);
function dueState(b){if(!b?.payment_due_date)return['—',''];let t=isoToday(),w=addDays(t,7);if(b.payment_due_date<t)return['Overdue','over'];if(b.payment_due_date<=w)return['Due soon','due'];return['Up to date','ok']}
function home(){let now=new Date(),y=now.getFullYear(),m=now.getMonth()+1,annual=cashYear(y),month=cashMonth(y,m),active=S.clients.filter(c=>c.status==='active').length,open=S.tasks.filter(t=>t.status!=='done').length,up=[...S.calendar].filter(x=>String(x.start_at).slice(0,10)>=isoToday()).sort((a,b)=>String(a.start_at).localeCompare(String(b.start_at)));let due=[...S.billing].filter(b=>b.active&&b.payment_due_date).sort((a,b)=>a.payment_due_date.localeCompare(b.payment_due_date));return title('Dashboard','Actual cash received and current client run rate.',`<button class="btn primary" data-add="client">+ Add client</button><button class="btn" data-add="task">+ Task</button><button class="btn" data-add="event">+ Event</button>`)+`<div class="grid kpis"><div class="card"><div class="label">Active clients</div><div class="value">${active}</div></div>${owner()?`<div class="card"><div class="label">Received this month</div><div class="value gold">${money(month)}</div><div class="sub">Lump sums count in full</div></div><div class="card"><div class="label">Received this year</div><div class="value green">${money(annual)}</div><div class="sub">Sum of paid payments</div></div>`:''}<div class="card"><div class="label">Open tasks</div><div class="value ${open?'bad':''}">${open}</div></div></div>${owner()?`<div class="grid two section"><div class="card"><div class="sectionhead"><h2>${y} cash received by month</h2><span class="muted">Run rate ${money(mrr())}/mo</span></div>${incomeChart(y)}</div><div class="card"><div class="label">Current monthly equivalent</div><div class="value gold">${money(mrr())}</div><p class="muted">This is the recurring-equivalent value of your active roster. It is separate from actual cash received so a lump-sum payment does not get spread across months.</p></div></div>`:''}<div class="grid two section"><div><div class="sectionhead"><h2>Upcoming</h2></div><div class="list">${up.slice(0,6).map(x=>`<div class="item"><div><div class="name">${esc(x.title)}</div><small>${dstr(x.start_at)} · ${esc(x.item_type)}</small></div></div>`).join('')||'<div class="empty">Nothing scheduled.</div>'}</div></div>${owner()?`<div><div class="sectionhead"><h2>Next payments</h2></div><div class="list">${due.slice(0,6).map(b=>{let c=client(b.client_id),s=dueState(b);return`<div class="item"><div><div class="name">${esc(c?.name)}</div><small>${money(b.billing_type==='lump_sum'?b.lump_sum_amount:b.monthly_equivalent)} · ${esc(b.payment_method)} · ${dstr(b.payment_due_date)}</small></div>${pill(s[0],s[1])}</div>`}).join('')||'<div class="empty">No due dates.</div>'}</div></div>`:''}</div>`}
function incomeChart(y){let vals=Array.from({length:12},(_,i)=>cashMonth(y,i+1)),max=Math.max(1,...vals);return`<div class="chart">${vals.map((v,i)=>`<div class="barWrap" title="${money(v)}"><div class="bar ${v?'':'zero'}" style="height:${Math.max(2,v/max*88)}%"></div><div class="barLabel">${new Date(y,i).toLocaleString('en',{month:'short'})}</div></div>`).join('')}</div>`}
function clientRows(arr=S.clients){return arr.map(c=>{let b=bill(c.id),s=dueState(b),co=coach(c.assigned_coach_id);return`<tr data-edit-client="${c.id}"><td><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.status)}</div></td><td>${esc(c.service_type||'—')}</td><td>${money(b?.monthly_equivalent)}</td><td>${pill(b?.billing_type==='lump_sum'?'Lump sum':'Monthly',b?.billing_type==='lump_sum'?'lump':'')}</td><td>${pill(b?.payment_method,b?.payment_method==='PayFast'?'payfast':'eft')}</td><td>${dstr(b?.payment_due_date)}<div class="sub">${pill(s[0],s[1])}</div></td><td>${esc(co?.display_name||'Head coach')}</td></tr>`}).join('')}
function clients(){return title('Clients','Roster, service, billing and coach assignment.',owner()?'<button class="btn primary" data-add="client">+ Add client</button>':'')+`<div class="toolbar"><input id="cs" class="input" placeholder="Search clients"><select id="sf" class="input"><option value="">All services</option><option>Contest prep</option><option>Lifestyle</option></select><select id="mf" class="input"><option value="">All methods</option><option>PayFast</option><option>EFT</option></select></div><div class="tablewrap"><table><thead><tr><th>Client</th><th>Service</th><th>Monthly equiv.</th><th>Billing</th><th>Method</th><th>Next due</th><th>Coach</th></tr></thead><tbody id="cr">${clientRows()}</tbody></table></div>`}
function payRows(filter='all',method=''){let t=isoToday(),w=addDays(t,7);return S.billing.filter(b=>b.active).filter(b=>!method||b.payment_method===method).filter(b=>filter==='all'||filter==='over'&&b.payment_due_date<t||filter==='week'&&b.payment_due_date>=t&&b.payment_due_date<=w||filter==='up'&&(!b.payment_due_date||b.payment_due_date>w)).sort((a,b)=>(a.payment_due_date||'9999').localeCompare(b.payment_due_date||'9999')).map(b=>{let c=client(b.client_id),s=dueState(b),amt=b.billing_type==='lump_sum'&&b.lump_sum_amount?b.lump_sum_amount:b.monthly_equivalent;return`<tr><td><div class="name">${esc(c?.name)}</div><div class="sub">${esc(c?.service_type||'')}</div></td><td>${esc(b.plan_label||b.billing_type)}</td><td><b>${money(amt)}</b>${b.billing_type==='lump_sum'?`<div class="sub">${money(b.monthly_equivalent)}/mo equivalent</div>`:''}</td><td>${pill(b.payment_method,b.payment_method==='PayFast'?'payfast':'eft')}</td><td>${dstr(b.payment_due_date)}<div class="sub">${pill(s[0],s[1])}</div></td><td><button class="btn sm primary" data-paid="${b.id}">Mark paid</button> <button class="btn sm" data-history="${b.client_id}">History</button></td></tr>`}).join('')}
function payments(){if(!owner())return'';let t=isoToday(),w=addDays(t,7),ov=S.billing.filter(b=>b.active&&b.payment_due_date&&b.payment_due_date<t).length,week=S.billing.filter(b=>b.active&&b.payment_due_date>=t&&b.payment_due_date<=w).length;return title('Payments','Actual payments drive your monthly and annual income figures.')+`<div class="grid four"><div class="card"><div class="label">Clients</div><div class="value">${S.clients.length}</div></div><div class="card"><div class="label">Overdue</div><div class="value bad">${ov}</div></div><div class="card"><div class="label">Due this week</div><div class="value gold">${week}</div></div><div class="card"><div class="label">Monthly equivalent</div><div class="value gold">${money(mrr())}</div></div></div><div class="toolbar section"><button class="btn sm" data-pf="all">All</button><button class="btn sm" data-pf="over">Overdue</button><button class="btn sm" data-pf="week">Due this week</button><button class="btn sm" data-pf="up">Up to date</button><select id="pm" class="input"><option value="">All methods</option><option>PayFast</option><option>EFT</option></select></div><div class="tablewrap"><table><thead><tr><th>Client</th><th>Plan</th><th>Cash due</th><th>Method</th><th>Next due</th><th></th></tr></thead><tbody id="pr">${payRows()}</tbody></table></div>`}
function earnings(){if(!owner())return'';let y=new Date().getFullYear(),annual=cashYear(y),nowM=new Date().getMonth()+1,avg=nowM?annual/nowM:0;return title('Earnings','Automatically calculated from payments marked paid — no manual monthly income entry.')+`<div class="grid four"><div class="card"><div class="label">Received this year</div><div class="value gold">${money(annual)}</div></div><div class="card"><div class="label">Received this month</div><div class="value">${money(cashMonth(y,nowM))}</div></div><div class="card"><div class="label">Average / elapsed month</div><div class="value">${money(avg)}</div></div><div class="card"><div class="label">Current monthly equivalent</div><div class="value green">${money(mrr())}</div></div></div><div class="note section">A lump-sum client contributes the full payment to the month it is received. Monthly equivalent is shown separately for planning and does not inflate or spread actual cash income.</div><div class="tablewrap section"><table><thead><tr><th>Month</th><th>Actual cash received</th><th>Payments</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{let ps=paid().filter(p=>{let d=new Date(p.received_date+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===i});return`<tr><td>${new Date(y,i).toLocaleString('en',{month:'long'})}</td><td><b>${money(ps.reduce((a,p)=>a+Number(p.amount||0),0))}</b></td><td>${ps.length}</td></tr>`}).join('')}</tbody></table></div><div class="card section"><div class="sectionhead"><h2>${y} income chart</h2></div>${incomeChart(y)}</div>`}
function planner(){let ev=[...S.calendar].sort((a,b)=>String(a.start_at).localeCompare(String(b.start_at))),ts=[...S.tasks].sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999'));return title('Calendar & Tasks','Show dates, travel, deadlines, business and personal planning.','<button class="btn primary" data-add="event">+ Event</button><button class="btn" data-add="task">+ Task</button>')+`<div class="grid two"><div><div class="sectionhead"><h2>Agenda</h2></div><div class="list">${ev.map(x=>`<div class="item"><div><div class="name">${x.item_type==='Show'?'<span class="bad">SHOW</span> · ':''}${esc(x.title)}</div><small>${dstr(x.start_at)} · ${esc(x.item_type)}${x.location?' · '+esc(x.location):''}</small></div></div>`).join('')||'<div class="empty">Nothing scheduled.</div>'}</div></div><div><div class="sectionhead"><h2>To-do</h2></div><div class="list">${ts.map(x=>`<div class="item"><div><div class="name">${esc(x.title)}</div><small>${x.due_date?dstr(x.due_date):'No due date'} · ${esc(x.category)} · ${esc(x.priority)}</small></div><button class="btn sm" data-done="${x.id}">${x.status==='done'?'Done':'Complete'}</button></div>`).join('')||'<div class="empty">No tasks.</div>'}</div></div></div>`}
function content(){let sts=['idea','draft','scheduled','posted'];return title('Content Planner','Instagram ideas, hooks, scripts and scheduling.','<button class="btn primary" data-add="content">+ Content idea</button>')+`<div class="kanban">${sts.map(st=>`<div class="col"><h3>${st}</h3><div class="list">${S.content.filter(x=>x.status===st).map(x=>`<div class="item"><div><div class="name">${esc(x.title)}</div><small>${esc(x.content_type)} · ${esc(x.pillar||'General')}</small>${x.hook?`<div class="sub" style="margin-top:6px">${esc(x.hook)}</div>`:''}</div></div>`).join('')||'<div class="empty">Empty</div>'}</div></div>`).join('')}</div>`}
function research(){return title('Research','Curated bodybuilding and fitness research library.')+`<div class="note">This remains a curated library for now. A future research automation can populate this table without changing the rest of the dashboard.</div><div class="grid two section">${S.research.map(r=>`<article class="study"><div style="display:flex;justify-content:space-between">${pill(r.topic)}<span class="gold">${r.relevance_score??'—'}/10</span></div><h3>${esc(r.title)}</h3><div class="sub">${esc(r.source)} · ${dstr(r.published_date)} · ${esc(r.study_type)}</div><p><b>Summary:</b> ${esc(r.summary)}</p><p><b>Context:</b> ${esc(r.context)}</p><details><summary>Practical takeaways</summary><ul>${(r.practical_takeaways||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><details><summary>Things to think about</summary><ul>${(r.things_to_think_about||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>${r.url?`<a class="btn sm" style="display:inline-block;margin-top:10px;text-decoration:none" href="${esc(r.url)}" target="_blank">Open study</a>`:''}</article>`).join('')||'<div class="empty">No saved research yet.</div>'}</div>`}
function coaches(){if(!owner())return'';return title('Coaches','Coach performance and commission management. Company finances remain owner/admin only.')+`<div class="note">Supabase RLS blocks coach accounts from company-wide earnings and other coaches' earnings.</div><div class="tablewrap section"><table><thead><tr><th>Coach</th><th>Commission</th><th>Rate</th><th>Clients</th><th>Monthly equivalent managed</th><th>Unpaid coach earnings</th></tr></thead><tbody>${S.coaches.map(c=>{let cs=S.clients.filter(x=>x.assigned_coach_id===c.id),rev=cs.reduce((a,x)=>a+Number(bill(x.id)?.monthly_equivalent||0),0),owed=S.coachEarnings.filter(x=>x.coach_id===c.id&&x.status!=='paid').reduce((a,x)=>a+Number(x.coach_amount||0),0);return`<tr><td><b>${esc(c.display_name)}</b></td><td>${esc(c.commission_type)}</td><td>${c.commission_type==='percentage'?Number(c.commission_rate||0)+'%':money(c.flat_amount)}</td><td>${cs.length}</td><td>${money(rev)}</td><td>${money(owed)}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No coaches yet.</td></tr>'}</tbody></table></div>`}
function render(){let f={home,clients,payments,earnings,planner,content,research,coaches}[page];$('#main').innerHTML=f?f():'';wire()}
function closeModal(){$('#modal').classList.add('hidden')}function modal(h){$('#modalBody').innerHTML=h;$('#modal').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}
function clientForm(id){let c=id?client(id):{},b=id?bill(id):{},opts='<option value="">Head coach / unassigned</option>'+S.coaches.map(x=>`<option value="${x.id}" ${c.assigned_coach_id===x.id?'selected':''}>${esc(x.display_name)}</option>`).join('');modal(`<div class="modalhead"><h2>${id?'Edit':'Add'} client</h2><button class="btn sm" data-close>Close</button></div><div class="formgrid"><input id="fn" class="input full" placeholder="Full name" value="${esc(c.name||'')}"><input id="fe" class="input" placeholder="Email" value="${esc(c.email||'')}"><input id="fp" class="input" placeholder="Phone" value="${esc(c.phone||'')}"><select id="fs" class="input"><option ${c.service_type==='Contest prep'?'selected':''}>Contest prep</option><option ${c.service_type==='Lifestyle'?'selected':''}>Lifestyle</option></select><select id="fst" class="input"><option value="active">active</option><option value="inactive" ${c.status==='inactive'?'selected':''}>inactive</option></select>${owner()?`<select id="fc" class="input full">${opts}</select>`:''}<select id="fb" class="input"><option value="monthly">Monthly</option><option value="lump_sum" ${b.billing_type==='lump_sum'?'selected':''}>Lump sum</option></select><select id="fm" class="input"><option ${b.payment_method==='PayFast'?'selected':''}>PayFast</option><option ${b.payment_method==='EFT'?'selected':''}>EFT</option></select><input id="fme" class="input" type="number" placeholder="Monthly equivalent" value="${b.monthly_equivalent??''}"><input id="fl" class="input" type="number" placeholder="Lump sum amount" value="${b.lump_sum_amount??''}"><input id="fd" class="input" type="date" value="${b.payment_due_date||''}"><input id="ft" class="input" type="number" placeholder="Term months: 3 / 6 / 12" value="${b.term_months??''}"><input id="fstart" class="input" type="date" value="${b.term_start_date||''}"><input id="fend" class="input" type="date" value="${b.term_end_date||''}"><textarea id="fnotes" class="input full" rows="3" placeholder="Notes">${esc(c.notes||'')}</textarea><button class="btn full" data-close>Cancel</button><button id="saveClient" class="btn primary full">Save client</button></div>`);$('#saveClient').onclick=()=>saveClient(id,b?.id)}
async function saveClient(id,bid){let rec={name:$('#fn').value,service_type:$('#fs').value,status:$('#fst').value,email:$('#fe').value||null,phone:$('#fp').value||null,notes:$('#fnotes').value||null};if(owner())rec.assigned_coach_id=$('#fc').value||null;let r=id?await sb.from('clients').update(rec).eq('id',id).select().single():await sb.from('clients').insert({...rec,created_by:S.profile.id}).select().single();if(r.error)return alert(r.error.message);id=r.data.id;if(owner()){let br={client_id:id,billing_type:$('#fb').value,term_months:Number($('#ft').value)||null,plan_label:$('#fb').value==='monthly'?'Monthly':(($('#ft').value||'')+' month term').trim(),monthly_equivalent:Number($('#fme').value)||0,lump_sum_amount:Number($('#fl').value)||null,payment_method:$('#fm').value,payment_due_date:$('#fd').value||null,term_start_date:$('#fstart').value||null,term_end_date:$('#fend').value||null,active:true};let q=bid?await sb.from('client_billing').update(br).eq('id',bid):await sb.from('client_billing').insert(br);if(q.error)return alert(q.error.message)}closeModal();await load();render()}
async function markPaid(id){let b=S.billing.find(x=>x.id===id),amt=b.billing_type==='lump_sum'&&b.lump_sum_amount?Number(b.lump_sum_amount):Number(b.monthly_equivalent);if(!confirm(`Record ${money(amt)} as paid today?`))return;let {error}=await sb.from('payments').insert({client_id:b.client_id,billing_id:b.id,due_date:b.payment_due_date,received_date:isoToday(),amount:amt,method:b.payment_method,payment_type:b.billing_type,status:'paid',recorded_by:S.profile.id});if(error)return alert(error.message);let step=b.billing_type==='lump_sum'?Number(b.term_months||1):1;let upd={payment_due_date:addMonths(b.payment_due_date||isoToday(),step)};if(b.billing_type==='lump_sum'&&b.term_end_date){upd.term_start_date=b.term_end_date;upd.term_end_date=addMonths(b.term_end_date,step)}await sb.from('client_billing').update(upd).eq('id',b.id);await load();render()}
function history(id){let ps=paid().filter(x=>x.client_id===id).sort((a,b)=>(b.received_date||'').localeCompare(a.received_date||''));modal(`<div class="modalhead"><h2>${esc(client(id)?.name)} · Payment history</h2><button class="btn sm" data-close>Close</button></div><div class="list section">${ps.map(p=>`<div class="item"><div><div class="name">${money(p.amount)}</div><small>${dstr(p.received_date)} · ${esc(p.method)} · ${esc(p.payment_type)}</small></div>${pill('Paid','ok')}</div>`).join('')||'<div class="empty">No recorded payments.</div>'}</div>`)}
function addTask(){modal(`<div class="modalhead"><h2>Add task</h2><button class="btn sm" data-close>Close</button></div><div class="formgrid"><input id="tt" class="input full" placeholder="Task"><input id="td" class="input" type="date"><select id="tc" class="input"><option>Business</option><option>Client</option><option>Content</option><option>Personal</option></select><select id="tp" class="input"><option>normal</option><option>high</option><option>low</option></select><select id="tv" class="input"><option value="private">Private</option><option value="team">Team</option><option value="all_coaches">All coaches</option></select><button id="ts" class="btn primary full">Save task</button></div>`);$('#ts').onclick=async()=>{let{error}=await sb.from('tasks').insert({title:$('#tt').value,due_date:$('#td').value||null,category:$('#tc').value,priority:$('#tp').value,status:'open',visibility:$('#tv').value,assigned_profile_id:S.profile.id,created_by:S.profile.id});if(error)return alert(error.message);closeModal();await load();render()}}
function addEvent(){modal(`<div class="modalhead"><h2>Add event</h2><button class="btn sm" data-close>Close</button></div><div class="formgrid"><input id="et" class="input full" placeholder="Event / show"><select id="ey" class="input"><option>Show</option><option>Travel</option><option>Business</option><option>Personal</option><option>Deadline</option><option>Client check-in</option></select><input id="ed" class="input" type="datetime-local"><input id="el" class="input full" placeholder="Location"><select id="ev" class="input"><option value="private">Private</option><option value="team">Team</option><option value="all_coaches">All coaches</option></select><button id="es" class="btn primary full">Save event</button></div>`);$('#es').onclick=async()=>{if(!$('#ed').value)return alert('Choose a date/time.');let{error}=await sb.from('calendar_items').insert({title:$('#et').value,item_type:$('#ey').value,start_at:new Date($('#ed').value).toISOString(),all_day:false,location:$('#el').value||null,visibility:$('#ev').value,assigned_profile_id:S.profile.id,created_by:S.profile.id});if(error)return alert(error.message);closeModal();await load();render()}}
function addContent(){modal(`<div class="modalhead"><h2>Add content idea</h2><button class="btn sm" data-close>Close</button></div><div class="formgrid"><input id="ct" class="input full" placeholder="Post idea"><select id="ctype" class="input"><option>Reel</option><option>Carousel</option><option>Story</option><option>Photo</option></select><input id="cp" class="input" placeholder="Pillar"><textarea id="ch" class="input full" rows="3" placeholder="Hook / angle"></textarea><textarea id="cc" class="input full" rows="5" placeholder="Caption / script"></textarea><button id="csave" class="btn primary full">Save idea</button></div>`);$('#csave').onclick=async()=>{let{error}=await sb.from('content_items').insert({title:$('#ct').value,platform:'Instagram',content_type:$('#ctype').value,status:'idea',pillar:$('#cp').value||null,hook:$('#ch').value||null,caption:$('#cc').value||null,assigned_profile_id:S.profile.id,visibility:'private',created_by:S.profile.id});if(error)return alert(error.message);closeModal();await load();render()}}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;renderNav();render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>({client:()=>clientForm(),task:addTask,event:addEvent,content:addContent}[b.dataset.add]?.()));document.querySelectorAll('[data-edit-client]').forEach(x=>x.onclick=()=>owner()&&clientForm(x.dataset.editClient));document.querySelectorAll('[data-paid]').forEach(x=>x.onclick=()=>markPaid(x.dataset.paid));document.querySelectorAll('[data-history]').forEach(x=>x.onclick=()=>history(x.dataset.history));document.querySelectorAll('[data-done]').forEach(x=>x.onclick=async()=>{await sb.from('tasks').update({status:'done'}).eq('id',x.dataset.done);await load();render()});let cs=$('#cs'),sf=$('#sf'),mf=$('#mf');let filterClients=()=>{$('#cr').innerHTML=clientRows(S.clients.filter(c=>(!cs.value||c.name.toLowerCase().includes(cs.value.toLowerCase()))&&(!sf.value||c.service_type===sf.value)&&(!mf.value||bill(c.id)?.payment_method===mf.value)))};if(cs){cs.oninput=filterClients;sf.onchange=filterClients;mf.onchange=filterClients}let pf='all';document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{pf=b.dataset.pf;$('#pr').innerHTML=payRows(pf,$('#pm').value)});if($('#pm'))$('#pm').onchange=()=>$('#pr').innerHTML=payRows(pf,$('#pm').value)}
async function bootstrap(){let{data:{session}}=await sb.auth.getSession();if(!session)return;await sb.rpc('claim_first_owner');let{data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error){$('#authmsg').textContent='Profile error: '+error.message;return}S.profile=p;$('#who').textContent=p.full_name||session.user.email;$('#role').textContent=p.role;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await load();renderNav();render()}
$('#signin').onclick=async()=>{let{error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return $('#authmsg').textContent=error.message;bootstrap()};$('#signup').onclick=async()=>{let{data,error}=await sb.auth.signUp({email:$('#email').value,password:$('#password').value,options:{data:{full_name:$('#email').value.split('@')[0]}}});if(error)return $('#authmsg').textContent=error.message;$('#authmsg').textContent=data.session?'Account created. Loading…':'Account created. Check your email if confirmation is required.';if(data.session)bootstrap()};$('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};bootstrap();
</script></body></html>
